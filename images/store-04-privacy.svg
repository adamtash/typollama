<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#17233a"/>
  <circle cx="1085" cy="120" r="250" fill="#1f3f6a" opacity=".55"/><circle cx="135" cy="760" r="280" fill="#1553a4" opacity=".3"/>
  <text x="100" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9ec4ff">PRIVACY IS A PRODUCT FEATURE</text>
  <text x="100" y="214" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#fff">Your writing stays in your control.</text>
  <text x="100" y="258" font-family="Arial, sans-serif" font-size="21" fill="#c3d4ea">Typollama processes text only when you invoke it.</text>
  <rect x="100" y="332" width="320" height="254" rx="22" fill="#fff"/>
  <rect x="132" y="366" width="54" height="54" rx="16" fill="#eaf3ff"/>
  <path d="M149 393v-8a10 10 0 0 1 20 0v8m-23 0h26v19h-26z" fill="none" stroke="#1767d6" stroke-width="3" stroke-linejoin="round"/>
  <text x="132" y="462" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17233a">Keys stay local</text>
  <text x="132" y="500" font-family="Arial, sans-serif" font-size="17" fill="#43516a">API keys are encrypted before</text>
  <text x="132" y="527" font-family="Arial, sans-serif" font-size="17" fill="#43516a">they are saved to the extension.</text>
  <rect x="480" y="332" width="320" height="254" rx="22" fill="#fff"/>
  <rect x="512" y="366" width="54" height="54" rx="16" fill="#eaf3ff"/>
  <path d="M526 393h26m-13-13v26" stroke="#1767d6" stroke-width="3" stroke-linecap="round"/>
  <text x="512" y="462" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17233a">You choose the route</text>
  <text x="512" y="500" font-family="Arial, sans-serif" font-size="17" fill="#43516a">Send text only to the provider</text>
  <text x="512" y="527" font-family="Arial, sans-serif" font-size="17" fill="#43516a">or local server you select.</text>
  <rect x="860" y="332" width="320" height="254" rx="22" fill="#fff"/>
  <rect x="892" y="366" width="54" height="54" rx="16" fill="#eaf3ff"/>
  <path d="M905 391l10 10 18-22" fill="none" stroke="#1767d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="892" y="462" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17233a">No hidden tracking</text>
  <text x="892" y="500" font-family="Arial, sans-serif" font-size="17" fill="#43516a">No analytics, ad targeting, or</text>
  <text x="892" y="527" font-family="Arial, sans-serif" font-size="17" fill="#43516a">Typollama processing backend.</text>
  <text x="100" y="682" font-family="Arial, sans-serif" font-size="18" fill="#c3d4ea">Use Ollama or LM Studio when a local-server workflow suits your work.</text>
</svg>
